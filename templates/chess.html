<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game - Play Online</title>
    <link rel="stylesheet" type="text/css" href="static/css/chess.css">
</head>
<body>
    <!-- Start Screen -->
    <div id="start-screen" class="start-screen">
        <div class="start-content">
            <h1>♔ Chess Game ♔</h1>
            <p class="subtitle">Test your skills in the timeless game of strategy</p>
            <button id="start-btn" class="primary-btn">Start New Game</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="game-screen hidden">
        <!-- Game Header -->
        <div class="game-header">
            <h2>Chess</h2>
            <button id="reset-btn" class="secondary-btn">New Game</button>
        </div>

        <!-- Main Game Container -->
        <div class="game-container">
            <!-- Left Panel - Black Captured Pieces -->
            <div class="side-panel left-panel">
                <h3>Black</h3>
                <div id="black-timer" class="timer">10:00</div>
                <div id="black-score" class="score">Score: <span class="score-value">0</span></div>
                <div id="black-captured" class="captured-pieces"></div>
            </div>

            <!-- Chess Board -->
            <div class="board-container">
                <div id="chess-board" class="chess-board"></div>
                <div class="board-controls">
                    <button id="flip-btn" class="icon-btn" title="Flip Board">⇅</button>
                    <div id="turn-indicator" class="turn-indicator">White's Turn</div>
                </div>
            </div>

            <!-- Right Panel - White Captured Pieces -->
            <div class="side-panel right-panel">
                <h3>White</h3>
                <div id="white-timer" class="timer">10:00</div>
                <div id="white-score" class="score">Score: <span class="score-value">0</span></div>
                <div id="white-captured" class="captured-pieces"></div>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="game-result">Checkmate!</h2>
            <p id="winner-text">White wins!</p>
            <button id="new-game-btn" class="primary-btn">Play Again</button>
        </div>
    </div>

    <!-- Pawn Promotion Modal -->
    <div id="promotion-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Promote Pawn</h3>
            <div class="promotion-pieces" id="promotion-choices"></div>
        </div>
    </div>

    <!-- JavaScript -->
    <script type="text/javascript" src="static/js/pieces/Piece.js"></script>
    <script type="text/javascript" src="static/js/pieces/King.js"></script>
    <script type="text/javascript" src="static/js/pieces/Queen.js"></script>
    <script type="text/javascript" src="static/js/pieces/Rook.js"></script>
    <script type="text/javascript" src="static/js/pieces/Bishop.js"></script>
    <script type="text/javascript" src="static/js/pieces/Knight.js"></script>
    <script type="text/javascript" src="static/js/pieces/Pawn.js"></script>
    <script type="text/javascript" src="static/js/Game.js"></script>
</body>
</html>
